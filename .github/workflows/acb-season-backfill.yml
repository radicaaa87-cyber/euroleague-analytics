name: ACB season backfill

on:
  pull_request:
    paths:
      - ".github/workflows/acb-season-backfill.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Backfill ACB 2025-26 and 2026-27-to-date
        shell: bash
        run: |
          set -euo pipefail

          import_one() {
            id="$1"
            response="$(curl --retry 3 --retry-delay 1 --fail --silent --show-error "https://oarlkqteranfdsvqgfyy.supabase.co/functions/v1/acb-import?match=$id")"
            python - "$id" "$response" <<'PY'
          import json, sys
          mid, raw = sys.argv[1], sys.argv[2]
          x = json.loads(raw)
          if not x.get('ok'):
              raise SystemExit(f'{mid}: import failed: {x}')
          print(f"IMPORTED {mid} players={x.get('players')} events={x.get('events')}")
          PY
          }
          export -f import_one

          run_edition() {
            edition="$1"
            rounds="$2"
            echo "START EDITION $edition"
            total=0
            for round in $(echo "$rounds" | tr "," " "); do
              schedule="$(curl --retry 3 --retry-delay 1 --fail --silent --show-error "https://oarlkqteranfdsvqgfyy.supabase.co/functions/v1/acb-rounds?edition=$edition&round=$round")"
              ids="$(python - "$schedule" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          ids=[str(m["id"]) for m in data.get("matches",[]) if str(m.get("matchStatus"))=="FINALIZED"]
          print(" ".join(ids))
          PY
              )"
              if [ -z "$ids" ]; then
                continue
              fi
              count="$(wc -w <<<"$ids" | tr -d " ")"
              total=$((total + count))
              echo "EDITION $edition ROUND $round FINALIZED $count"
              tr ' ' '\n' <<<"$ids" | sed '/^$/d' | xargs -n1 -P4 bash -c 'import_one "$1"' _
            done
            echo "DONE EDITION $edition FINALIZED_IMPORT_REQUESTS $total"
          }

          run_edition 90 "5884,5885,5886,5887,5888,5889,5890,5891,5892,5893,5894,5895,5896,5897,5898,5899,5900,5901,5902,5903,5904,5905,5906,5907,5908,5909,5910,5911,5912,5913,5914,5915,5916,5917,6002,6003,6004,6005,6006,6007,6010,6011,6012,6013"
          run_edition 91 "6015,6016,6017,6018,6019,6020,6021,6022,6023,6024,6025,6026,6027,6028,6029,6030,6031,6032,6033,6034,6035,6036,6037,6038,6039,6040,6041,6042,6043,6044,6045,6046,6047,6048"
