name: Verify ML training warehouse

on:
  push:
    branches:
      - feat/acb-ingestion
      - feat/player-points-model10-situation-signals
    paths:
      - ".github/backfill/verify-training-warehouse.trigger"

permissions:
  contents: read

concurrency:
  group: verify-ml-training-warehouse
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore ready training warehouse snapshot cache
        id: snapshot_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-snapshot
          key: ml-training-warehouse-pg17-${{ hashFiles('.github/ml-training-snapshot.version', 'migrations/*.up.sql') }}

      - name: Create disposable training database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5433/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("create role anon nologin")
              connection.execute("create role authenticated nologin")
              connection.execute("create database euroleague_test")
          PY

      - name: Load cached training warehouse snapshot
        if: steps.snapshot_cache.outputs.cache-hit == 'true'
        run: |
          sha256sum -c .training-snapshot/warehouse.sql.gz.sha256
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          gzip -dc .training-snapshot/warehouse.sql.gz |
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d euroleague_test -v ON_ERROR_STOP=1

      - name: Restore raw archive cache
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        id: raw_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-cache
          key: ml-raw-archives-v1-E2023-E2024-E2025

      - name: Restore checksum-verified training archives
        if: steps.snapshot_cache.outputs.cache-hit != 'true' && steps.raw_cache.outputs.cache-hit != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python scripts/restore_training_archives.py
          E2023 E2024 E2025 --cache-dir .training-cache

      - name: Save raw archive cache
        if: steps.snapshot_cache.outputs.cache-hit != 'true' && steps.raw_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-cache
          key: ml-raw-archives-v1-E2023-E2024-E2025

      - name: Build disposable local historical warehouse
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        env:
          EL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: >-
          python scripts/load_local_warehouse.py
          E2023 E2024 E2025
          --schema warehouse
          --replace
          --cache-dir .training-cache
          --output ml-output/local_warehouse.json

      - name: Copy compact ACB and context data
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: python scripts/copy_training_context.py

      - name: Create ready training warehouse snapshot
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .training-snapshot
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump             -U postgres -d euroleague_test             --schema=warehouse --no-owner --no-privileges |
            gzip -1 > .training-snapshot/warehouse.sql.gz
          sha256sum .training-snapshot/warehouse.sql.gz             > .training-snapshot/warehouse.sql.gz.sha256

      - name: Save ready training warehouse snapshot cache
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-snapshot
          key: ml-training-warehouse-pg17-${{ hashFiles('.github/ml-training-snapshot.version', 'migrations/*.up.sql') }}

      - name: Execute training SQL smoke verification
        env:
          EL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: |
          mkdir -p ml-output
          python scripts/verify_local_training_warehouse.py | tee ml-output/warehouse-verification.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ml-training-warehouse-verification
          path: ml-output/
          if-no-files-found: warn
          retention-days: 30
