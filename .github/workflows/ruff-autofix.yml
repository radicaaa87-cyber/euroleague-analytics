name: Ruff autofix

on:
  push:
    paths:
      - ".github/ruff-fix-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff==0.16.5
      - name: Fix lint and format
        run: |
          ruff format .
          ruff check . --fix
          ruff format .
          ruff check .
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add .
          git commit -m "Autoformat ACB MCP changes"
          git push
