name: Train player-points ML

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Immutable model version, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv
      - name: Install training dependencies
        run: |
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
          uv pip install --python .venv\Scripts\python.exe -r requirements-ml.txt
          uv pip install --python .venv\Scripts\python.exe -e .
      - name: Train E2023-E2024 and blind-test E2025
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ml-output | Out-Null
          .venv\Scripts\python.exe scripts/train_player_points_ml.py --train-season E2023 --validation-season E2024 --test-season E2025 --minutes-basis official --min-history-games 3 --report ml-output/report.json --model ml-output/player_points_model.pkl --predictions ml-output/e2025_predictions.csv
      - name: Persist candidate model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: powershell
        run: |
          .venv\Scripts\python.exe scripts/register_trained_model.py --model ml-output/player_points_model.pkl --report ml-output/report.json --family player_points --version "${{ inputs.model_version }}" --git-commit "${{ github.sha }}"
      - name: Upload ML artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-points-ml-${{ inputs.model_version }}
          path: ml-output/
          if-no-files-found: error
          retention-days: 30
