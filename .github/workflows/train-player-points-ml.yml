name: Train player-points ML

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Immutable model version, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv
      - name: Install training dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -r requirements-ml.txt
          uv pip install --python .venv/bin/python -e .
      - name: Create disposable training database
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5433/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("create database euroleague_test")
          PY
      - name: Restore checksum-verified training archives
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          .venv/bin/python scripts/restore_training_archives.py
          E2023 E2024 E2025 --cache-dir .training-cache
      - name: Build disposable local historical warehouse
        env:
          EL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: >-
          .venv/bin/python scripts/load_local_warehouse.py
          E2023 E2024 E2025
          --schema warehouse
          --replace
          --cache-dir .training-cache
          --output ml-output/local_warehouse.json
      - name: Copy compact ACB, identity and pregame context
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: .venv/bin/python scripts/copy_training_context.py
      - name: Benchmark four model families and blind-test the validation winner
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
          PGOPTIONS: "-c search_path=warehouse"
        run: |
          mkdir -p ml-output
          .venv/bin/python scripts/train_player_points_ml.py --train-season E2023 --validation-season E2024 --test-season E2025 --minutes-basis official --min-history-games 3 --report ml-output/report.json --model ml-output/player_points_model.pkl --predictions ml-output/e2025_predictions.csv --preblind-lock ml-output/preblind_lock.json
      - name: Persist candidate model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODEL_VERSION: ${{ inputs.model_version }}
          MODEL_GIT_COMMIT: ${{ github.sha }}
        run: |
          .venv/bin/python scripts/register_trained_model.py --model ml-output/player_points_model.pkl --report ml-output/report.json --family player_points --version "$MODEL_VERSION" --git-commit "$MODEL_GIT_COMMIT"
      - name: Upload ML artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-points-ml-${{ inputs.model_version }}
          path: ml-output/
          if-no-files-found: error
          retention-days: 30
