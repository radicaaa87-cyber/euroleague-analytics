name: Audit bookmaker player-points model

on:
  workflow_dispatch:
  push:
    branches: [feat/acb-ingestion]
    paths:
      - .github/bookmaker-model-audit.request

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Create Python environment
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e .

      - name: Restore ready training warehouse snapshot cache
        id: snapshot_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-snapshot
          key: ml-training-warehouse-pg17-${{ hashFiles('.github/ml-training-snapshot.version', 'migrations/*.up.sql') }}

      - name: Require verified warehouse snapshot
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        run: |
          echo "Verified training warehouse snapshot cache is required."
          exit 1

      - name: Create disposable warehouse database
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5433/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("create role anon nologin")
              connection.execute("create role authenticated nologin")
              connection.execute("create database euroleague_test")
          PY

      - name: Load verified training warehouse snapshot
        run: |
          sha256sum -c .training-snapshot/warehouse.sql.gz.sha256
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          gzip -dc .training-snapshot/warehouse.sql.gz |
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d euroleague_test -v ON_ERROR_STOP=1

      - name: Compare Mozzart lines with pregame averages
        env:
          LIVE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WAREHOUSE_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: .venv/bin/python scripts/analyze_bookmaker_vs_average.py
