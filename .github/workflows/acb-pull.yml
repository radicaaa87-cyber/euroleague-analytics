name: Pull ACB season

on:
  workflow_dispatch:
    inputs:
      season:
        description: "ACB season, e.g. 2026-27"
        required: true
        default: "2026-27"
      with_pbp:
        description: "Also pull play-by-play"
        required: true
        default: true
        type: boolean

jobs:
  pull-acb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ACB_API_KEY: ${{ secrets.ACB_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify ACB API key
        run: |
          python - <<'PY'
          import os, sys
          if not os.getenv("ACB_API_KEY", "").strip():
              print("Missing GitHub secret ACB_API_KEY", file=sys.stderr)
              raise SystemExit(1)
          print("ACB_API_KEY configured")
          PY
      - name: Pull season
        shell: bash
        run: |
          if [ "${{ inputs.with_pbp }}" = "true" ]; then
            python scripts/pull_acb.py --season "${{ inputs.season }}" --with-pbp --with-shots --with-advanced
          else
            python scripts/pull_acb.py --season "${{ inputs.season }}" --with-shots --with-advanced
          fi
      - name: Build player game logs
        run: python scripts/build_acb_player_game_logs.py --season "${{ inputs.season }}"
      - uses: actions/upload-artifact@v4
        with:
          name: acb-raw-${{ inputs.season }}
          path: data/acb_raw/${{ inputs.season }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: acb-player-game-logs-${{ inputs.season }}
          path: data/acb_processed/${{ inputs.season }}/player_game_logs.csv
          retention-days: 90
