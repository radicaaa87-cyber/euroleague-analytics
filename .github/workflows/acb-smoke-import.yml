name: ACB one-game smoke import

on:
  pull_request:
    paths:
      - ".github/workflows/acb-smoke-import.yml"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import ACB match 105683 through staging function
        env:
          ACB_IMPORT_URL: "https://oarlkqteranfdsvqgfyy.supabase.co/functions/v1/acb-import?token=acb-import-20261004-9c7f8a2d5e4b&match=105683"
        run: |
          response="$(curl --fail --silent --show-error "$ACB_IMPORT_URL")"
          echo "$response"
          python -c 'import json,sys; x=json.loads(sys.stdin.read()); assert x["ok"] and x["players"] > 0 and x["events"] > 0' <<<"$response"
