name: Validate player-points ML signals

on:
  workflow_dispatch:
  push:
    branches: [feat/acb-ingestion, feat/player-points-model10-situation-signals]
    paths:
      - .github/ml-validation.request

permissions:
  contents: read

concurrency:
  group: validate-player-points-ml
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv

      - name: Install training dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -r requirements-ml.txt
          uv pip install --python .venv/bin/python -e .

      - name: Restore ready training warehouse snapshot cache
        id: snapshot_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-snapshot
          key: ml-training-warehouse-pg17-${{ hashFiles('.github/ml-training-snapshot.version', 'migrations/*.up.sql') }}

      - name: Require verified warehouse snapshot
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        run: |
          echo "Verified training warehouse snapshot cache is required."
          exit 1

      - name: Create disposable training database
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5433/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("create role anon nologin")
              connection.execute("create role authenticated nologin")
              connection.execute("create database euroleague_test")
          PY

      - name: Load verified training warehouse snapshot
        run: |
          sha256sum -c .training-snapshot/warehouse.sql.gz.sha256
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          gzip -dc .training-snapshot/warehouse.sql.gz |
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d euroleague_test -v ON_ERROR_STOP=1

      - name: Train regime-gated role model and validate on E2024
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
          PGOPTIONS: "-c search_path=warehouse"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p ml-output
          .venv/bin/python scripts/train_player_points_validation.py \
            --train-season E2023 \
            --validation-season E2024 \
            --blind-season E2025 \
            --context-season E2022 \
            --enabled-engine role2 \
            --enabled-engine rotation \
            --minutes-basis official \
            --min-history-games 3 \
            --report ml-output/validation_report.json \
            --model ml-output/validation_candidate.pkl \
            --predictions ml-output/e2024_validation_predictions.csv

      - name: Assert blind season stayed closed
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ml-output/validation_report.json").read_text())
          assert report["blind_test_opened"] is False
          assert report["leakage_audit"]["blind_season_queried"] is False
          assert report["blind_policy"]["status"] == "BLOCKED_PENDING_SIGNAL_REVIEW"
          print("E2025 blind firewall confirmed.")
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-points-validation-${{ github.run_number }}
          path: ml-output/
          if-no-files-found: error
          retention-days: 30
