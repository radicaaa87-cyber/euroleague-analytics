name: Link bookmaker offers to historical games

on:
  push:
    branches:
      - feat/player-points-model10-situation-signals
    paths:
      - ".github/bookmaker-game-link.request"

permissions:
  contents: read

concurrency:
  group: link-bookmaker-games
  cancel-in-progress: true

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore verified training warehouse snapshot
        id: snapshot_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .training-snapshot
          key: ml-training-warehouse-pg17-${{ hashFiles('.github/ml-training-snapshot.version', 'migrations/*.up.sql') }}

      - name: Require verified snapshot
        if: steps.snapshot_cache.outputs.cache-hit != 'true'
        run: |
          echo "Verified training warehouse snapshot cache is required."
          exit 1

      - name: Create disposable historical database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5433/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("create role anon nologin")
              connection.execute("create role authenticated nologin")
              connection.execute("create database euroleague_test")
          PY

      - name: Load verified historical snapshot
        run: |
          sha256sum -c .training-snapshot/warehouse.sql.gz.sha256
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          gzip -dc .training-snapshot/warehouse.sql.gz |
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d euroleague_test -v ON_ERROR_STOP=1

      - name: Link exact athlete-date offers to games
        timeout-minutes: 10
        env:
          BOOKMAKER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/euroleague_test
        run: |
          mkdir -p ml-output
          python scripts/link_bookmaker_games.py \
            --apply \
            --output ml-output/bookmaker-game-link.json

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookmaker-game-link-${{ github.run_number }}
          path: ml-output/
          if-no-files-found: warn
          retention-days: 30
